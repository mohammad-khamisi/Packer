---
common_packages_redhat:
  - curl
  - tar
  - socat
  - conntrack-tools
  - iproute-tc
  - ipset
  - ipvsadm
  - chrony
  - bash-completion
  - python3-libselinux
common_packages_debian:
  - curl
  - ca-certificates
  - gnupg
  - socat
  - conntrack
  - ipset
  - ipvsadm
  - chrony
  - bash-completion
  - apt-transport-https
  - python3-debian # needed by deb822_repository

common_kernel_modules:
  - overlay
  - br_netfilter

common_sysctl:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
