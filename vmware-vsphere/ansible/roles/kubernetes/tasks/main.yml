---
# ----- RedHat family -----
- name: Install Kubernetes packages (RedHat)
  when: ansible_os_family == 'RedHat'
  block:
    - name: Add Kubernetes repo
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes v{{ kubernetes_version }}
        baseurl: "{{ kubernetes_repo_url }}/rpm/"
        gpgcheck: true
        gpgkey: "{{ kubernetes_repo_url }}/rpm/repodata/repomd.xml.key"
        exclude: [kubelet, kubeadm, kubectl, cri-tools, kubernetes-cni]

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.dnf:
        name: >-
          {{ kubernetes_packages | map('regex_replace', '$', '-' ~ kubernetes_package_version if kubernetes_package_version else '') | list }}
        state: present
        disable_excludes: kubernetes

# ----- Debian family -----
- name: Install Kubernetes packages (Debian)
  when: ansible_os_family == 'Debian'
  block:
    - name: Add Kubernetes repo
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: [deb]
        uris: "{{ kubernetes_repo_url }}/deb/"
        suites: [/]
        signed_by: "{{ kubernetes_repo_url }}/deb/Release.key"

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name: >-
          {{ kubernetes_packages | map('regex_replace', '$', '=' ~ kubernetes_package_version ~ '-*' if kubernetes_package_version else '') | list }}
        state: present
        update_cache: true
        allow_change_held_packages: true

    - name: Hold packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ kubernetes_packages }}"

# ----- kubelet -----
- name: Set kubelet node IP
  ansible.builtin.copy:
    dest: "{{ '/etc/sysconfig/kubelet' if ansible_os_family == 'RedHat' else '/etc/default/kubelet' }}"
    mode: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}
  notify: Restart kubelet

- name: Enable kubelet (it restarts in a loop until kubeadm init/join)
  ansible.builtin.service:
    name: kubelet
    enabled: true

- name: Pre-pull control-plane images
  ansible.builtin.shell: kubeadm config images pull --kubernetes-version "$(kubeadm version -o short)"
  when: inventory_hostname in groups['masters']
  changed_when: false
