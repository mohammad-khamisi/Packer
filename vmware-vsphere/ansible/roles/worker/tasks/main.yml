---
- name: Check whether this node is already part of the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join worker
  when: not kubelet_conf.stat.exists
  block:
    - name: Create join token on first master
      ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
      delegate_to: "{{ groups['masters'][0] }}"
      register: join_command
      changed_when: true

    - name: Join the cluster
      ansible.builtin.command: "{{ join_command.stdout }}"
      changed_when: true

- name: Label node as worker
  ansible.builtin.command: >-
    kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/worker= --overwrite
  delegate_to: "{{ groups['masters'][0] }}"
  register: label_result
  changed_when: "'labeled' in label_result.stdout and 'not labeled' not in label_result.stdout"
