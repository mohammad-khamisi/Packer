---
# Full cluster build:  ansible-playbook site.yml
- name: Prepare all nodes (OS, containerd, kubeadm/kubelet/kubectl)
  hosts: k8s_cluster
  gather_facts: true
  roles:
    - common
    - containerd
    - kubernetes

- name: Bootstrap control plane (first master init, others join one by one)
  hosts: masters
  serial: 1
  gather_facts: true
  roles:
    - control_plane

- name: Install CNI (Calico)
  hosts: masters[0]
  gather_facts: false
  roles:
    - cni

- name: Join workers
  hosts: workers
  gather_facts: true
  roles:
    - worker

- name: Verify cluster
  hosts: masters[0]
  gather_facts: false
  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=600s
      changed_when: false

    - name: Get nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
